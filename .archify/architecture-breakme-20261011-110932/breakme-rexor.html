<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Break Me — arquitectura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./rexor-tokens.css">
<link rel="stylesheet" href="./rexor-bundle.css">
<style>
  html, body { margin:0; padding:0; background:var(--surface); font-family:var(--font-sans); }
  #root { min-height:100vh; }
  .rx-dh { display:flex; align-items:flex-start; justify-content:space-between; gap:var(--space-6); flex-wrap:wrap; }
  .rx-dh-title { font-family:var(--font-display); font-size:24px; line-height:32px; font-weight:600; color:var(--ink); margin:0; display:flex; align-items:center; gap:var(--space-2); }
  .rx-dh-sub { font-size:13px; line-height:20px; color:var(--ink-muted); margin:4px 0 0; }
  .rx-dh-tools { display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; }
  .rx-dh-group { display:flex; align-items:center; gap:var(--space-2); border:1px solid var(--line); border-radius:var(--radius-md); padding:4px; background:var(--surface-raised); }
  .rx-note { max-width:900px; margin:var(--space-6) 0 0; padding:var(--space-4); border:1px dashed var(--line-strong); border-radius:var(--radius-lg); background:var(--surface-raised); color:var(--ink-muted); font-size:13px; line-height:20px; }
  .rx-note b { color:var(--ink); }
  .rx-note code { font-family:var(--font-mono); background:var(--surface-sunken); padding:1px 5px; border-radius:var(--radius-sm); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="./rexor-bundle.js"></script>
<script>
(function () {
  var X = window.Rexor, h = React.createElement;

  var nodes = [
    { id: 'user',    kind: 'actor',    title: 'Usuario',        subtitle: 'navegador',                    badge: null,    x: 24,   y: 318, w: 180, h: 84 },
    { id: 'fe',      kind: 'client',   title: 'Frontend',       subtitle: 'Vite + React :5173',            badge: 'SRC 4', x: 284,  y: 318, w: 208, h: 84 },
    { id: 'core',    kind: 'service',  title: 'Core',           subtitle: 'BoxLang + bx-ai :8081',         badge: 'SRC 5', x: 764,  y: 318, w: 208, h: 84 },
    { id: 'atlas',   kind: 'service',  title: 'atlas-redteam',  subtitle: 'Python MCP :8765',              badge: 'SRC 2', x: 764,  y: 96,  w: 208, h: 84 },
    { id: 'rep',     kind: 'server',   title: 'Reports',        subtitle: 'BoxLang MiniServer :8082',      badge: 'SRC 2', x: 284,  y: 548, w: 208, h: 84 },
    { id: 'llm',     kind: 'external', title: 'MiniMax',        subtitle: 'proveedor LLM (bx-ai)',         badge: 'SRC 1', x: 764,  y: 548, w: 208, h: 84 },
    { id: 'ai',      kind: 'target',   title: 'AI objetivo',    subtitle: 'del usuario final',             badge: 'Target',x: 1196, y: 318, w: 200, h: 84 }
  ];

  var edges = [
    { from: 'user', to: 'fe',    label: 'HTTPS' },
    { from: 'fe',   to: 'core',  label: 'POST run / execute / chat.bxm' },
    { from: 'core', to: 'atlas', label: 'MCP (stateless HTTP)' },
    { from: 'core', to: 'ai',    label: 'HTTP probes (targetAdapter)', tone: 'attack' },
    { from: 'core', to: 'llm',   label: 'LLM calls (aiAgent)' },
    { from: 'fe',   to: 'rep',   label: 'POST report.bxm', dashed: true }
  ];

  var groups = [
    { id: 'net', label: 'Red Docker: microservices', x: 254, y: 52, w: 750, h: 612, tone: 'network' }
  ];

  function View() {
    var themeState = React.useState(
      (typeof localStorage !== 'undefined' && localStorage.getItem('rx-theme')) || 'light'
    );
    var theme = themeState[0], setTheme = themeState[1];

    React.useEffect(function () {
      document.documentElement.setAttribute('data-theme', theme);
      try { localStorage.setItem('rx-theme', theme); } catch (e) {}
    }, [theme]);

    return h('div', { style: { padding: '24px 32px 40px', display: 'grid', gap: '4px', background: 'var(--surface)', minHeight: '100vh', boxSizing: 'border-box' } },
      h('div', { className: 'rx-dh' },
        h('div', null,
          h('h1', { className: 'rx-dh-title' }, h(X.StatusDot, { status: 'live', label: false }), 'Break Me — arquitectura de microservicios'),
          h('p', { className: 'rx-dh-sub' }, 'Pentesting automático de IAs con MITRE ATLAS · hackathon ANIA x Ortus')
        ),
        h('div', { className: 'rx-dh-tools' },
          h('div', { className: 'rx-dh-group' },
            h(X.ThemeToggle, { value: theme, onChange: setTheme })
          )
        )
      ),
      h(X.ArchDiagram, {
        nodes: nodes, edges: edges, groups: groups,
        width: 1420, height: 700, viewportHeight: 680, defaultZoom: 0.88
      }),
      h('div', { className: 'rx-note' },
        h('b', null, 'Working tree sin commitear (HEAD '), h('code', null, '97932ad'), h('b', null, '): '),
        'el refactor de Core a ', h('code', null, 'models/Planner.bx'), ' + ', h('code', null, 'models/Executor.bx'),
        ', y el nuevo ', h('code', null, 'chat.bxm'), '/', h('code', null, 'mcp.bxm'),
        ' — Core expone su propio MCP ("rexor") para manejar run/execute vía un agente conversacional (ya verificado end-to-end, documentado en CLAUDE.md, aún sin commit). ',
        'Reports también suma un crosswalk OWASP (', h('code', null, 'atlas-owasp-map.json'), ') en working tree.'
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(View));
})();
</script>
</body>
</html>
