[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-redteam"
version = "0.1.0"
description = "Educational AI red-team MCP microservice built on the MITRE ATLAS catalog"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
atlas-redteam-mcp = "atlas_redteam.mcp_server:main"

[tool.setuptools.packages.find]
include = ["atlas_redteam*"]

[tool.setuptools.package-data]
atlas_redteam = ["../data/*.yaml"]
